<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="title">DON'T PANIC</div>
        
        <div class="input-wrapper">
            <input 
                type="text" 
                class="todo-input" 
                placeholder="What's mostly harmless?"
                id="todoInput"
            >
        </div>

        <div class="todo-list" id="todoList">
            <div class="empty-state">Nothing to panic about... yet</div>
        </div>

        <div class="counter" id="counter" style="display: none;">
            <span id="remainingCount">0</span> left
        </div>
    </div>

    <script src="newtab.js"></script>
</body>
</html>
